name: CI & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes an in-flight run pointless; multi-arch
  # image builds are slow enough that letting them pile up is wasteful.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Run tests
        run: uv run --python ${{ matrix.python }} pytest -q

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    # Gates the push on the tests: an image that fails its own suite should
    # never reach the registry Unraid pulls from.
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check registry secrets
        # A missing secret otherwise surfaces as an opaque login failure, which
        # is a slow thing to diagnose from a red tick.
        if: github.event_name != 'pull_request'
        run: |
          missing=""
          [ -n "${{ secrets.DOCKER_REGISTRY }}" ] || missing="$missing DOCKER_REGISTRY"
          [ -n "${{ secrets.DOCKER_USERNAME }}" ] || missing="$missing DOCKER_USERNAME"
          [ -n "${{ secrets.DOCKER_PASSWORD }}" ] || missing="$missing DOCKER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Set them with: gh secret set <NAME>"
            exit 1
          fi

      - name: Log in to the registry
        # Pull requests from forks cannot read secrets, so the build below still
        # runs on a PR to prove the Dockerfile is sound — it just does not push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Set DOCKER_IMAGE when the registry needs a namespace or project
          # segment (Harbor, Nexus and GitLab all do), e.g.
          # registry.example.com/homelab/mcphub. Otherwise the image sits at the
          # registry root as <registry>/mcphub.
          #
          # These come from secrets, so tags render masked in the logs. To read
          # them, move the non-sensitive parts to repository variables and use
          # vars.* here instead.
          images: ${{ secrets.DOCKER_IMAGE || format('{0}/mcphub', secrets.DOCKER_REGISTRY) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        # Loads an amd64-only build on the runner and checks the app actually
        # starts and serves /healthz. A green multi-arch build only proves the
        # image assembled, not that it runs.
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mcphub:smoke
          cache-from: type=gha

      - name: Run smoke test
        run: |
          set -euo pipefail
          # A root-owned bind mount on purpose: that is what plain `docker run`
          # and Unraid's appdata both produce, and getting it wrong is how the
          # container fails with an opaque sqlite error instead of a useful one.
          sudo mkdir -p /tmp/smoke-data
          sudo chown root:root /tmp/smoke-data

          docker run -d --name smoke -p 8080:8080 \
            -e MCPHUB_DEV=1 -e MCPHUB_PUBLIC_URL=http://127.0.0.1:8080 \
            -v /tmp/smoke-data:/data mcphub:smoke

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz OK"

              curl -fsS http://127.0.0.1:8080/.well-known/oauth-authorization-server \
                | grep -q '"issuer"' && echo "oauth metadata OK"

              docker logs smoke 2>&1 | grep -q "First run: created the 'admin' account" \
                && echo "admin bootstrap OK" || { echo "admin bootstrap missing"; exit 1; }

              # Privileges were actually dropped: root here would mean the
              # entrypoint silently skipped it.
              uid=$(docker exec smoke id -u)
              [ "$uid" = "99" ] && echo "running as uid 99 OK" \
                || { echo "expected uid 99, got $uid"; exit 1; }

              # And the database really landed on the mounted volume.
              sudo test -f /tmp/smoke-data/hub.db && echo "hub.db on the volume OK" \
                || { echo "hub.db missing from /data"; exit 1; }

              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs smoke; exit 1
