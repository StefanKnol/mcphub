name: Verify servers

on:
  schedule:
    # Weekly. A badge only means something if something re-checks it; a server
    # that quietly stops launching should turn the build red, not sit there
    # still claiming to be verified.
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["src/mcphub/data/verified.json", "scripts/verify_servers.py"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev

      - name: Launch each listed server and record what it did
        # Without --write on a PR: report, and fail if something that used to
        # verify no longer does. The scheduled run below refreshes the file.
        run: uv run python scripts/verify_servers.py ${{ github.event_name == 'schedule' && '--write' || '' }}

      - name: Show what changed
        if: github.event_name == 'schedule'
        run: git --no-pager diff -- src/mcphub/data/verified.json || true

      - name: Open a pull request with refreshed results
        if: github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-verified-servers
          title: "Refresh verified server list"
          body: |
            Scheduled re-verification. Each entry here was produced by actually
            launching the server and listing its tools, so a change in this file
            is a change in observed behaviour rather than an edit.
          commit-message: "Refresh verified server list"
          add-paths: src/mcphub/data/verified.json
