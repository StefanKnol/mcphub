[project]
name = "mcphub"
version = "0.1.0"
description = "Self-hosted MCP platform: OAuth-protected, web-configured, one MCP endpoint per backend instance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2>=2.5.0"]

# Backends are plugins, discovered through this entry point group. A plugin is
# any pip-installable package; the proxy ships here only because it is the one
# backend that is about the hub itself rather than about a particular device.
[project.entry-points."mcphub.plugins"]
mcp-proxy = "mcphub.plugins.builtin.mcpproxy:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcphub"]

# The verified-server list ships with the hub so the badge works offline and
# reflects the build you are running, not whatever a remote list says today.
[tool.hatch.build.targets.wheel.force-include]
"src/mcphub/data/verified.json" = "mcphub/data/verified.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
