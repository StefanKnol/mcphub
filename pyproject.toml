[project]
name = "mcphub"
version = "0.1.0"
description = "Self-hosted MCP platform: OAuth-protected, web-configured, one MCP endpoint per backend instance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "cryptography>=44.0",
    "librouteros>=3.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2>=2.5.0"]

# Backends are plugins. Built-ins register here exactly like third-party ones
# would, so there is no privileged path into the registry.
[project.entry-points."mcphub.plugins"]
mikrotik = "mcphub.plugins.builtin.mikrotik:PLUGIN"
mcp-proxy = "mcphub.plugins.builtin.mcpproxy:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcphub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
