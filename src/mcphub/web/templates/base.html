<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mcphub{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14171a; --muted: #5b6570;
    --line: #dfe3e8; --accent: #1f6feb; --ok: #1a7f46; --bad: #b3261e;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --panel:#161b22; --ink:#e6edf3; --muted:#9aa7b4;
            --line:#2a313a; --accent:#589bff; --ok:#3fb950; --bad:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  a { color: var(--accent); }
  header { border-bottom:1px solid var(--line); background:var(--panel); }
  .bar { max-width:900px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; }
  .bar strong { font-size:16px; letter-spacing:-.01em; }
  .bar nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
  main { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.02em; }
  h2 { font-size:16px; margin:28px 0 10px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:5px; }
  .help { color:var(--muted); font-size:13px; margin:5px 0 0; }
  /* An attribute selector does not match a defaulted type: `input[type=text]`
     skips `<input name="username">` entirely, leaving it unstyled beside the
     password field below it. Match the types we use and the absent case. */
  input:not([type]), input[type=text], input[type=password], input[type=number],
  input[type=search], input[type=email], input[type=url], textarea {
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font:inherit; appearance:none; }
  textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; resize:vertical; }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.8; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  input:disabled, textarea:disabled { opacity:.6; cursor:not-allowed; }
  input[type=search]::-webkit-search-decoration,
  input[type=search]::-webkit-search-cancel-button { appearance:none; }
  input[type=checkbox] { width:auto; accent-color:var(--accent); }
  /* :user-invalid, not :invalid — the latter matches an empty required field
     on page load, so every form opens covered in red before anyone types. */
  input:user-invalid, textarea:user-invalid { border-color:var(--bad); }
  .field { margin-bottom:16px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row > .field { flex:1 1 220px; }
  button, .btn {
    font:inherit; font-weight:600; padding:9px 15px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); text-decoration:none;
    display:inline-block; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); border-color:var(--bad); background:transparent; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .pill { font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .pill.on { color:var(--ok); border-color:var(--ok); }
  .pill.off { color:var(--muted); }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  .url { display:block; margin-top:8px; padding:8px 10px; background:var(--bg);
         border:1px solid var(--line); border-radius:8px; word-break:break-all; }
  .errors { border:1px solid var(--bad); color:var(--bad); border-radius:8px; padding:11px 14px; margin-bottom:18px; }
  .note { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; }
  .grid .card { margin:0; display:flex; flex-direction:column; }
  .grid .card .actions { margin-top:auto; padding-top:12px; }
  .logo { width:38px; height:38px; border-radius:9px; flex:none; object-fit:contain;
          background:var(--bg); border:1px solid var(--line); }
  /* Not every server publishes an icon, so the fallback is a monogram rather
     than a broken-image frame or a generic placeholder repeated down the page. */
  .monogram { display:flex; align-items:center; justify-content:center;
              font-weight:700; font-size:15px; color:var(--accent); letter-spacing:-.02em; }
  .backend { display:flex; gap:14px; align-items:flex-start; }
  .backend .meta { flex:1; min-width:0; }
  .checkline { display:flex; align-items:center; gap:9px; }
  .checkline label { margin:0; font-weight:500; }
  .result { font-size:13px; margin-left:4px; }
  .result.ok { color:var(--ok); } .result.bad { color:var(--bad); }
  .toolbar { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  button.tiny { padding:3px 9px; font-size:12px; font-weight:500; }
  .filter { flex:1 1 160px; padding:5px 9px; font-size:13px; }
  .picker { max-height:340px; overflow-y:auto; border:1px solid var(--line);
            border-radius:8px; padding:6px 10px; background:var(--bg); }
  .pick { display:flex; gap:8px; align-items:flex-start; padding:3px 0; }
  .pick label { font-weight:400; margin:0; font-size:13px; cursor:pointer; }
  .pick input { margin-top:3px; flex:none; }
  .count { margin-left:auto; }
  /* A styled <dialog>, not the platform's confirm(): the native dialog ignores
     the page's theming entirely and looks wrong in dark mode. Using the element
     rather than hand-rolling one keeps focus trapping, background inerting and
     Escape-to-close, which are tedious to get right by hand. */
  dialog.modal {
    border:1px solid var(--line); border-radius:var(--radius); padding:0;
    background:var(--panel); color:var(--ink); max-width:420px; width:calc(100% - 40px); }
  dialog.modal::backdrop { background:rgba(0,0,0,.55); backdrop-filter:blur(2px); }
  dialog.modal .body { padding:20px 20px 0; }
  dialog.modal h3 { margin:0 0 8px; font-size:16px; }
  dialog.modal p { margin:0; color:var(--muted); font-size:14px; }
  dialog.modal .foot { display:flex; gap:10px; justify-content:flex-end; padding:18px 20px 20px; }
  .field-error { color:var(--bad); font-size:13px; margin:5px 0 0; }
  /* The platform's own select ignores the theme, so it is restyled and given a
     drawn arrow rather than the user agent's. */
  .select-wrap { position:relative; }
  .select-wrap::after {
    content:""; position:absolute; right:13px; top:50%; width:8px; height:8px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  select {
    width:100%; padding:9px 34px 9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font:inherit; appearance:none; cursor:pointer; }
  .field[hidden] { display:none; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td,th { text-align:left; padding:7px 10px 7px 0; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header><div class="bar">
  <strong>mcphub</strong>
  {% if user %}<nav>
    <a href="/">Backends</a>{% if is_admin %}<a href="/accounts">Accounts</a>{% endif %}<a href="/account">Account</a>
    <form method="post" action="/logout" style="display:inline"><button style="padding:2px 10px;font-size:13px">Sign out</button></form>
  </nav>{% endif %}
</div></header>
<main>{% block body %}{% endblock %}</main>

<dialog class="modal" id="app-confirm">
  <div class="body">
    <h3 id="app-confirm-title">Are you sure?</h3>
    <p id="app-confirm-body"></p>
  </div>
  <div class="foot">
    <button type="button" data-close>Cancel</button>
    <button type="button" class="danger" id="app-confirm-go">Confirm</button>
  </div>
</dialog>

<script>
// Any form carrying data-confirm asks in-page instead of through confirm().
(function () {
  var dialog = document.getElementById("app-confirm");
  var title = document.getElementById("app-confirm-title");
  var body = document.getElementById("app-confirm-body");
  var go = document.getElementById("app-confirm-go");
  var pending = null;

  dialog.querySelector("[data-close]").addEventListener("click", function () { dialog.close(); });
  go.addEventListener("click", function () {
    var form = pending;
    dialog.close();
    if (form) { form.dataset.confirmed = "1"; form.submit(); }
  });

  document.querySelectorAll("form[data-confirm]").forEach(function (form) {
    form.addEventListener("submit", function (event) {
      if (form.dataset.confirmed) return;
      event.preventDefault();
      pending = form;
      title.textContent = form.dataset.confirmTitle || "Are you sure?";
      body.textContent = form.dataset.confirm;
      go.textContent = form.dataset.confirmAction || "Confirm";
      dialog.showModal();
    });
  });
})();

// Fields that only apply to one branch of a form are hidden on the others,
// rather than shown with a note saying they will be ignored.
(function () {
  var conditional = document.querySelectorAll("[data-show-if-field]");
  if (!conditional.length) return;

  function apply() {
    conditional.forEach(function (field) {
      var control = document.getElementsByName(field.dataset.showIfField)[0];
      if (!control) return;
      var shown = String(control.value) === field.dataset.showIfValue;
      field.hidden = !shown;
      // A hidden required field would block submission with a message nobody
      // can see, so its constraint is lifted while it is out of the way.
      field.querySelectorAll("input, textarea, select").forEach(function (el) {
        if (shown) {
          if (el.dataset.wasRequired) { el.required = true; delete el.dataset.wasRequired; }
        } else if (el.required) {
          el.dataset.wasRequired = "1";
          el.required = false;
        }
      });
    });
  }

  document.querySelectorAll("select, input[type=checkbox]").forEach(function (el) {
    el.addEventListener("change", apply);
  });
  apply();
})();

// Native validation bubbles are the browser's own widget and ignore the theme,
// so forms opt out and the message is rendered in the page instead.
(function () {
  document.querySelectorAll("form.validated").forEach(function (form) {
    form.setAttribute("novalidate", "");

    function clear(field) {
      var existing = field.parentNode.querySelector(".field-error");
      if (existing) existing.remove();
    }

    function complain(field) {
      clear(field);
      var message = field.dataset.error
        || (field.validity.valueMissing ? "This field is required."
        : field.validity.patternMismatch ? "That is not a valid value for this field."
        : field.validity.tooShort ? "This needs to be at least " + field.minLength + " characters."
        : "Please check this value.");
      var note = document.createElement("p");
      note.className = "field-error";
      note.textContent = message;
      field.insertAdjacentElement("afterend", note);
    }

    form.addEventListener("submit", function (event) {
      var bad = null;
      form.querySelectorAll("input, textarea, select").forEach(function (field) {
        if (field.disabled || field.type === "hidden") return;
        if (field.checkValidity()) { clear(field); return; }
        complain(field);
        if (!bad) bad = field;
      });
      if (bad) {
        event.preventDefault();
        event.stopImmediatePropagation();
        bad.focus();
        bad.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    });

    form.addEventListener("input", function (event) {
      if (event.target.checkValidity()) clear(event.target);
    });
  });
})();
</script>
</body>
</html>
